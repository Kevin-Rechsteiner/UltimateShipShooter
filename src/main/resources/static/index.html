<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 720px;
            margin: 40px auto;
            padding: 0 16px;
            line-height: 1.5;
        }

        h1 {
            margin-bottom: 8px;
        }

        .status {
            margin-bottom: 16px;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 16px;
            font-size: 16px;
            cursor: pointer;
        }

        ul {
            padding-left: 20px;
        }

        li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
<h1>Einfaches WebSocket-Beispiel</h1>
<p>Tippe unten etwas ein. Der Text wird per WebSocket an das Backend gesendet und die Antwort wird darunter angezeigt.</p>

<div class="status" id="status">Status: verbinde...</div>

<div class="controls">
    <input id="messageInput" type="text" placeholder="Zum Beispiel: Hallo Backend!">
    <button id="sendButton" type="button">Senden</button>
</div>

<ul id="messages"></ul>

<script>
    const status = document.getElementById('status');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');
    const messages = document.getElementById('messages');

    const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const socket = new WebSocket(`${protocol}://${window.location.host}/ws`);

    function addMessage(text) {
        const item = document.createElement('li');
        item.textContent = text;
        messages.appendChild(item);
    }

    socket.onopen = () => {
        status.textContent = 'Status: verbunden';
    };

    socket.onmessage = (event) => {
        addMessage(`Backend: ${event.data}`);
    };

    socket.onerror = () => {
        status.textContent = 'Status: Fehler beim Verbinden';
        addMessage('Fehler: Die WebSocket-Verbindung konnte nicht aufgebaut werden.');
    };

    socket.onclose = () => {
        status.textContent = 'Status: Verbindung geschlossen';
    };

    function sendMessage() {
        const text = messageInput.value.trim();

        if (!text) {
            addMessage('Frontend: Bitte zuerst Text eingeben.');
            return;
        }

        if (socket.readyState !== WebSocket.OPEN) {
            addMessage('Frontend: Verbindung ist noch nicht offen.');
            return;
        }

        addMessage(`Frontend: ${text}`);
        socket.send(text);
        messageInput.value = '';
        messageInput.focus();
    }

    sendButton.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            sendMessage();
        }
    });
</script>
</body>
</html>
